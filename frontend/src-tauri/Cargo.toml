[package]
name = "comic-translator"
version = "1.0.0"
description = "Local-first Manga, Manhwa, and Manhua AI Comic Translator Desktop Shell"
authors = ["MangaFlow AI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
