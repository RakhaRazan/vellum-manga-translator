<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vellum - 100% Native C++17 + ONNX Runtime + WebView2 Comic Translation & Typesetting Desktop Studio" />
    <title>Vellum - Comic Translation & Typesetting Studio</title>
    <link rel="icon" type="image/svg+xml" href="/vellum-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved =
            window.localStorage.getItem('vellum.theme') ||
            window.localStorage.getItem('mangaflow.theme') ||
            'dark';
          var resolved =
            saved === 'light'
              ? 'light'
              : saved === 'dark'
              ? 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(resolved);
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-studio-canvas text-studio-text antialiased selection:bg-studio-accent/25 selection:text-studio-text overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
